name: Automated Test Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # 依赖在 Linux runner 上拉取：同样的 URL，linux 只要 3 秒，
  # Windows runner 上 curl 会超时（exit 28）。下好之后当 artifact 传过去。
  # ------------------------------------------------------------------
  fetch-deps:
    name: fetch-deps
    runs-on: ubuntu-latest
    steps:
      - name: Download lua
        run: |
          set -e
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 30 --max-time 300 \
            -o lua.tar.gz https://www.lua.org/ftp/lua-5.4.8.tar.gz
          echo "4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae  lua.tar.gz" | sha256sum -c -

      - name: Download premake
        run: |
          set -e
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 30 --max-time 300 \
            -o premake-5.zip https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-windows.zip
          echo "e64ce2ed8778e0098f63674cca61fe33941b5f0c8d9a4afd651152bdea3758ab  premake-5.zip" | sha256sum -c -

      - name: Upload deps
        uses: actions/upload-artifact@v6
        with:
          name: deps
          path: |
            lua.tar.gz
            premake-5.zip
          if-no-files-found: error
          retention-days: 3

  build-windows:
    name: build-windows
    needs: fetch-deps
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch deps
        uses: actions/download-artifact@v6
        with:
          name: deps

      - name: Prepare lua
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          tar -xzf lua.tar.gz
          if (-not (Test-Path 'lua-5.4.8\src\lua.h')) { throw 'lua 解压后结构不对：找不到 lua-5.4.8\src\lua.h' }
          Move-Item -Force 'lua-5.4.8' 'lua'

      - name: Premake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'premake-5' | Out-Null
          Expand-Archive -Path 'premake-5.zip' -DestinationPath 'premake-5' -Force
          Copy-Item 'premake\lua.lua' 'lua\premake5.lua' -Force
          Copy-Item 'premake\dll.lua' 'dll.lua' -Force
          & '.\premake-5\premake5.exe' vs2022 --file=dll.lua
          if ($LASTEXITCODE -ne 0) { throw "premake 退出码 $LASTEXITCODE" }
          if (-not (Test-Path 'build\ocgcoredll.sln')) { throw 'premake 没有生成 build\ocgcoredll.sln' }

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild 'build\ocgcoredll.sln' /m /t:Build /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "msbuild 退出码 $LASTEXITCODE" }

      - name: Upload ocgcore.dll
        uses: actions/upload-artifact@v6
        with:
          name: ocgcore-windows
          path: build/bin/x64/Release/ocgcore.dll
          if-no-files-found: error
